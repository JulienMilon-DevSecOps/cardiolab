include:
  - component: $CI_SERVER_FQDN/project-jmilon-devsecops/ci-cd/pipeline-python-centralisee/python-package@0.11.1
    inputs:
      python_version: "3.12"
      # cardiolab n'a pas d'extra "test" : extras qui couvrent toute la suite de tests
      project_extras: "dev,analysis,database,garmin"
      pytest_args: "-q"
      # Couverture mesurée sur le package uniquement (fail_under = 80 dans pyproject.toml)
      pytest_cov_source: "cardiolab"
      # Tests d'intégration sur la base PostgreSQL jetable du job pytest-postgres
      pytest_database: postgres
      # Publication PyPI / TestPyPI sans secret (Trusted Publishing)
      pypi_auth_method: trusted
      # ── Sécurité : état des contrôles (gitleaks toujours actif et bloquant) ──
      version_check_enabled: true          # version du tag = version du pyproject.toml, bloquant
      ruff_allow_failure: false            # lint et formatage, bloquant
      sast_allow_failure: false            # règles de sécurité Ruff, bloquant
      dependency_scan_allow_failure: true  # vulnérabilités des dépendances + SBOM, non bloquant

variables:
  # Identifiants de la base de test jetable (POSTGRES_* définis par la pipeline centralisée)
  DB_HOST_TEST: "postgres"
  DB_PORT_TEST: "5432"
  DB_NAME_TEST: "$POSTGRES_DB"
  DB_USER_TEST: "$POSTGRES_USER"
  DB_PASSWORD_TEST: "$POSTGRES_PASSWORD"
